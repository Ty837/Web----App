<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Thảm Nhà Xinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-brand" href="index.html">Thảm Nhà Xinh</a>
    <section class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">CHÀO MỪNG BẠN QUAY LẠI</p>
      <h1 id="login-title">Đăng nhập</h1>
      <p class="auth-intro">Nhập bất kỳ email và mật khẩu để tiếp tục mua sắm với tài khoản có sẵn.</p>
      <form action="index.html" method="get" novalidate>
        <label for="u">Email</label>
        <input type="text" id="u" name="email" placeholder="ban@example.com" value="tralalerotralala@email.com">
        <label for="p">Mật khẩu</label>
        <input type="password" id="p" name="password" placeholder="Nhập mật khẩu" value="123456">
        <button class="btn auth-submit" type="submit">Đăng nhập</button>
      </form>
      <p class="auth-switch">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></p>
      <a class="auth-back" href="index.html">← Quay lại cửa hàng</a>
    </section>
  </main>
</body>
</html>
