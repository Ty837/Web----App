<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký | Thảm Nhà Xinh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-brand" href="index.html">Thảm Nhà Xinh</a>
    <section class="auth-card" aria-labelledby="register-title">
      <p class="eyebrow">TẠO TÀI KHOẢN</p>
      <h1 id="register-title">Đăng ký mua sắm</h1>
      <p class="auth-intro">Mọi thông tin đăng ký đều dùng chung trải nghiệm mua sắm của cửa hàng.</p>
      <form action="index.html" method="get" novalidate>
        <label for="hoten">Họ và tên</label>
        <input type="text" id="hoten" name="name" placeholder="Nguyễn Văn A">
        <div class="row">
          <div><label for="email">Email</label><input type="text" id="email" name="email" placeholder="ban@example.com"></div>
          <div><label for="sdt">Số điện thoại</label><input type="text" id="sdt" name="phone" placeholder="0900 000 000"></div>
        </div>
        <label for="mk">Mật khẩu</label>
        <input type="password" id="mk" name="password" placeholder="Nhập mật khẩu">
        <button class="btn auth-submit" type="submit">Tạo tài khoản &amp; mua sắm</button>
      </form>
      <p class="auth-switch">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
      <a class="auth-back" href="index.html">← Quay lại cửa hàng</a>
    </section>
  </main>
</body>
</html>
